name: Windows installer

# Builds GridMapEditor-Setup-<version>.exe on every push to main.
# Version comes from __version__ in src/grid_map_editor/__init__.py. Push a matching
# tag (e.g. "v0.1.0") to also publish the installer as a GitHub Release.
on:
  push:
    branches: [main]
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Inno Setup
        run: |
          if (-not (Test-Path "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe")) {
            choco install innosetup -y --no-progress
          }

      - name: Determine version
        id: version
        run: |
          $init = Get-Content src/grid_map_editor/__init__.py -Raw
          if ($init -notmatch '__version__\s*=\s*"([^"]+)"') { throw "__version__ not found" }
          $v = $Matches[1]
          if ($env:GITHUB_REF -like "refs/tags/v*") {
            $tag = $env:GITHUB_REF_NAME -replace '^v', ''
            if ($tag -ne $v) { throw "Tag version $tag does not match __version__ ($v)" }
          }
          "version=$v" >> $env:GITHUB_OUTPUT

      - name: Build installer
        run: ./windows/build.ps1 -Version "${{ steps.version.outputs.version }}"

      - name: Smoke test (bundled app starts without errors)
        run: |
          $exe = "build/pyinstaller/dist/GridMapEditor/GridMapEditor.exe"
          $p = Start-Process $exe -ArgumentList "--renderer", "cpu" -PassThru
          Start-Sleep -Seconds 20
          if ($p.HasExited) {
            Get-Content "$env:LOCALAPPDATA/GridMapEditor/logs/app.log" -ErrorAction SilentlyContinue
            throw "GridMapEditor.exe exited early with code $($p.ExitCode)"
          }
          Stop-Process -Id $p.Id -Force
          Get-Content "$env:LOCALAPPDATA/GridMapEditor/logs/app.log" -ErrorAction SilentlyContinue

      - uses: actions/upload-artifact@v4
        with:
          name: GridMapEditor-Setup-${{ steps.version.outputs.version }}-run${{ github.run_number }}
          path: dist-installer/*.exe
          if-no-files-found: error

      - name: Test install.bat (install from source)
        shell: cmd
        run: |
          echo.| call install.bat
          if errorlevel 1 exit /b 1
          .venv\Scripts\python.exe -X utf8 -c "import grid_map_editor.app; print('import OK')"

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist-installer/*.exe
